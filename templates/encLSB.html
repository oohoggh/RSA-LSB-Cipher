<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <title>Зашифровка</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <header>
        <div class="mode-switcher">
            <a href="/encRSA">Шифрование RSA</a>
            <a href="/decRSA">Дешифрование RSA</a>
        </div>
        <div class="mode-switcher">
            <a href="/encLSB" class="active">Шифрование LSB</a>
            <a href="/decLSB">Дешифрование LSB</a>
        </div>
    </header>
    <form method="post" enctype="multipart/form-data">
        <table>
            <tr>
                <td colspan="2"><h1>Шифрование LSB</h1></td>
            </tr>
            <tr>
                <td>
                    <textarea class="textareaLSB textareaLSBRight" name="lsb_text" placeholder="Введите текст, который надо зашифровать в фото."></textarea>
                </td>
                <td>
                    <label class="image-upload-box image-upload-boxLeft" id="dropZone">
                    <input type="file" name="image" accept="image/*" id="imageInput" hidden>
                    <img id="imagePreview" src="" alt="" style="display: none;">
                    </label>
                </td>
            </tr>
            <tr>
                <td colspan="2"><input type="submit" value="Зашифровать"></td>
            </tr>
        </table>
    </form>
    <script>
        const dropZone = document.getElementById('dropZone');
        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');

        function showPreview(file) {
            if (file && file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = function(e) {
                imagePreview.src = e.target.result;
                imagePreview.style.display = 'block';
            };
            reader.readAsDataURL(file);
            }
        }

        imageInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
            showPreview(this.files[0]);
            }
        });

        dropZone.addEventListener('dragover', function(e) {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', function() {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', function(e) {
            e.preventDefault();
            dropZone.classList.remove('dragover');

            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
            imageInput.files = e.dataTransfer.files;
            showPreview(e.dataTransfer.files[0]);
            }
        });
    </script>
    <script>
        document.querySelector('form').addEventListener('submit', function(event) {
            const fileInput = document.querySelector('input[type="file"]');
            const textInput = document.querySelector('textarea');

            if (!fileInput.files.length || textInput.value.trim() === "") {
                event.preventDefault();
            }
        });
    </script>
</body>
</html>
